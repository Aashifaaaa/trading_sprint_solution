[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-analytics-etl"
version = "0.1.0"
description = "Sprint 4 Fauxnance analytics ETL"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "duckdb>=1.0,<2",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
trading-etl = "trading_analytics.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
